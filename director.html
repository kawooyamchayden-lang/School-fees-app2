<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f6f4a"><meta name="robots" content="noindex">
<title>Director view</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1c2a22;--mute:#667269;--line:#dfe3dc;--pri:#1f6f4a;--bad:#b3261e;--warn:#a65f00}
@media(prefers-color-scheme:dark){:root{--bg:#121915;--card:#1b2420;--ink:#e8efe9;--mute:#9aa89f;--line:#2c3832;--pri:#4cb87f;--bad:#ff8a80;--warn:#f0b35a}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:14px}.sub{color:var(--mute);font-size:13px}h2{font-size:16px;margin:0 0 10px}
.top{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 90%,#fff),color-mix(in srgb,var(--pri) 50%,#000));color:#fff;border-radius:22px;padding:14px 16px}
.top img,.lg{width:52px;height:52px;border-radius:15px;object-fit:cover;background:#fff;flex:none;display:grid;place-items:center;font-size:26px}.top h1{font-size:19px;margin:0}.top .sub{color:rgba(255,255,255,.85)}.grow{flex:1;min-width:0}
button,input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}input,select{width:100%}button{cursor:pointer;font-weight:600}button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}.top button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);min-height:36px;padding:4px 12px}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.06)}
.cols{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:820px){.cols{grid-template-columns:1fr 1fr;align-items:start}}
.big{font-size:32px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,currentColor 12%,transparent)}.ok{color:var(--pri)}.wn{color:var(--warn)}.bd{color:var(--bad)}
.seg{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:8px 0}.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.bars{display:flex;gap:6px;align-items:flex-end;height:96px;margin-top:6px}.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;padding:0;border:0;background:none;font-size:11px;color:var(--mute)}.bar i{display:block;width:100%;min-height:3px;background:var(--line);border-radius:6px 6px 2px 2px}.bar.on i{background:var(--pri)}.bar.on{color:var(--ink);font-weight:700}
.r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.r:last-child{border:0}.r b{font-variant-numeric:tabular-nums}.vd{text-decoration:line-through;opacity:.55}.clk{cursor:pointer}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative;flex:none}.ring::before{content:"";position:absolute;inset:9px;background:var(--card);border-radius:50%}.ring b{position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mute)}
.warn{border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:9px 12px;margin:10px 0;font-size:13px}.empty{text-align:center;color:var(--mute);padding:20px 0}
.login{max-width:380px;margin:9vh auto;text-align:center}.login .lg{width:90px;height:90px;margin:0 auto 12px;font-size:44px;background:linear-gradient(135deg,var(--pri),#0f3d29)}.login input{margin:8px 0}.login label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);justify-content:center}.login label input{width:auto;min-height:0;margin:0}
</style></head><body><div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),U=n=>'UGX '+Math.round(n||0).toLocaleString('en-US'),te=new TextEncoder();
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),okLogo=l=>/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(l||'');
let S=null,K=null,tab='today',vd='',per='',q='',sync=0,err='';
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>ds(new Date()),addDay=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ds(d)};
const dlab=d=>d===today()?'Today':d===addDay(today(),-1)?'Yesterday':new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const ix=p=>{const a=p.split(' ');return+a[2]*3+ +a[1]-1},pO=i=>'Term '+(i%3+1)+' '+Math.floor(i/3),cur=()=>{const n=new Date(),m=n.getMonth();return'Term '+(m<4?1:m<8?2:3)+' '+n.getFullYear()};
const act=()=>S.pupils.filter(p=>!p.left),pu=id=>S.pupils.find(p=>p.id===id),cn=p=>p.cls+(p.stream?' '+p.stream:'');
const feeOf=(p,k)=>{const h=p.h&&p.h[k];return h?+h.fee:+p.fee||0},paid=(id,k)=>S.payments.reduce((a,x)=>a+(x.pupilId===id&&x.period===k&&!x.void?+x.amount||0:0),0);
const carry=(p,k)=>{if(p.since==null)return 0;const a=ix(k),s=Math.max(p.since,a-12);let f=0,d=0;for(let i=s;i<a;i++){const z=pO(i);f+=feeOf(p,z);d+=paid(p.id,z)}return f-d},bal=(p,k)=>feeOf(p,k)+carry(p,k)-paid(p.id,k);
const lastClosed=()=>(S.closed||[]).reduce((m,c)=>c.date>m?c.date:m,''),sumOn=d=>S.payments.reduce((a,p)=>a+(p.date===d&&!p.void?+p.amount||0:0),0);
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' day(s) ago'};
/* load + decrypt (same scheme as the bursar app) */
async function keys(pw){const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits','deriveKey']),pb=s=>({name:'PBKDF2',salt:te.encode(s),iterations:150000,hash:'SHA-256'});return{id:hx(await crypto.subtle.deriveBits(pb('fees-id-v1'),k,256)),ck:await crypto.subtle.deriveKey(pb('fees-key-v1'),k,{name:'AES-GCM',length:256},false,['decrypt'])}}
async function load(){const r=await fetch('/api/backup?id='+K.id,{cache:'no-store'});if(r.status===404)throw'nf';if(!r.ok)throw'net';const j=await r.json();S=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(j.iv)},K.ck,ub(j.d))));S.payments=S.payments||[];S.pupils=S.pupils||[];sync=j.t||S.lastCloud||0}
async function signIn(pw,rem){$('#msg')&&($('#msg').textContent='Opening…');try{K=await keys(pw);await load();if(rem)localStorage.setItem('dirpw',pw);per=cur();draw()}catch(e){K=null;S=null;localStorage.removeItem('dirpw');login(e==='nf'?'No data found for that passphrase. Check it, or ask the bursar to turn on cloud backup.':'Could not connect. Check the internet and try again.')}}
async function refresh(){try{await load();err=''}catch(e){err='Could not reach the server. Showing the last data received.'}if(!(tab==='find'&&document.activeElement&&document.activeElement.tagName==='INPUT'))draw()}
/* views */
function login(m){S=null;$('#app').innerHTML=`<div class="login"><div class="lg">🏫</div><h1>Director view</h1><p class="sub">Read-only view of the school's fee collections. Enter the backup passphrase given by the bursar.</p><input id="pw" type="password" placeholder="Backup passphrase" autocomplete="off"><label><input id="rem" type="checkbox">Remember on this device</label><p id="msg" class="${m?'bd':'sub'}">${E(m||'')}</p><button class="pri" style="width:100%" data-a="in">Open</button></div>`;$('#pw').focus()}
function draw(){if(!S)return login();const stale=sync&&Date.now()-sync>864e5;$('#app').innerHTML=`<div class="top">${okLogo(S.logo)?`<img src="${S.logo}" alt="">`:'<div class="lg">🏫</div>'}<div class="grow"><h1>${E(S.school||'School')}</h1><div class="sub">Director view · updated ${sync?E(ago(sync)):'unknown'}</div></div><button data-a="ref">Refresh</button><button data-a="out">Lock</button></div>${err?`<div class="warn">${E(err)}</div>`:''}${stale?'<div class="warn">⚠️ The school PC has not sent new data for over a day. Figures may be out of date.</div>':''}<div class="tabs">${[['today','Daily'],['term','Term'],['find','Find']].map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>${({today:vDay,term:vTerm,find:vFind})[tab]()}`}
const rowH=p=>{const u=pu(p.pupilId);return`<div class="r ${p.void?'vd':''}"><div><b>${E(u?u.name:'(removed)')}</b><div class="sub">${p.time?E(p.time)+' · ':''}${E(p.receipt)} · ${u?E(cn(u))+' · ':''}${E(p.method)}${p.void?' · VOID: '+E(p.why||''):''}</div></div><b>${U(p.amount)}</b></div>`};
function vDay(){const d=vd||today(),l=S.payments.filter(p=>p.date===d).sort((a,b)=>(b.at||0)-(a.at||0)||b.seq-a.seq),ok=l.filter(p=>!p.void),tot=ok.reduce((a,p)=>a+(+p.amount||0),0),m={},cols={Cash:'#2e9e6a','Mobile money':'#e0a800',Bank:'#3b8fc7'},cl=!!lastClosed()&&d<=lastClosed();ok.forEach(p=>m[p.method]=(m[p.method]||0)+(+p.amount||0));
 const days=[...Array(7)].map((_,i)=>addDay(today(),i-6)),tt=days.map(sumOn),mx=Math.max(...tt,1);
 return`<div class="cols"><div><div class="card"><div class="row"><div class="row" style="gap:6px"><button data-d="${addDay(d,-1)}">‹</button><button data-d="${addDay(d,1)}"${d>=today()?' disabled':''}>›</button></div><b>${E(dlab(d))}</b><span class="tag ${cl?'ok':'wn'}">${cl?'🔒 Closed':'● Open'}</span></div><div class="big" style="margin-top:8px">${U(tot)}</div><div class="sub">${ok.length} payment(s) · ${E(d)}</div><div class="seg">${tot?Object.keys(cols).map(k=>`<i style="width:${(m[k]||0)/tot*100}%;background:${cols[k]}"></i>`).join(''):''}</div><div class="leg">${Object.keys(cols).map(k=>`<span><i style="background:${cols[k]}"></i>${k} ${U(m[k]||0)}</span>`).join('')}</div></div><div class="card"><h2>Last 7 days</h2><div class="bars">${days.map((x,i)=>`<button class="bar ${x===d?'on':''}" data-d="${x}" title="${E(U(tt[i]))}"><i style="height:${tt[i]/mx*100}%"></i><span>${x.slice(8)}</span></button>`).join('')}</div></div></div><div class="card"><h2>Transactions</h2>${l.length?l.map(rowH).join(''):'<div class="empty">No payments on this day.</div>'}</div></div>`}
function vTerm(){const k=per||cur(),A=act(),set=new Set([cur(),...S.payments.map(p=>p.period)]),ps=[...set].filter(Boolean).sort((a,b)=>ix(b)-ix(a));let e=0,c=0,o=0;const by={},dd={};
 A.forEach(p=>{const f=feeOf(p,k)+Math.max(0,carry(p,k)),pd=paid(p.id,k),b=Math.max(0,bal(p,k)),z=by[cn(p)]=by[cn(p)]||{n:0,c:0,o:0};e+=f;c+=pd;o+=b;z.n++;z.c+=pd;z.o+=b});
 S.payments.forEach(p=>{if(p.period===k&&!p.void){const z=dd[p.date]=dd[p.date]||{n:0,t:0};z.n++;z.t+=+p.amount||0}});
 const pc=e?Math.min(100,Math.round(c/e*100)):0,CL=['Baby','Middle','Top','P.1','P.2','P.3','P.4','P.5','P.6','P.7'],rk=x=>CL.findIndex(c=>x===c||x.startsWith(c+' ')),ks=Object.keys(by).sort((a,b)=>rk(a)-rk(b)||a.localeCompare(b)),top=A.map(p=>({p,o:bal(p,k)})).filter(x=>x.o>0).sort((a,b)=>b.o-a.o).slice(0,10),days=Object.keys(dd).sort().reverse();
 return`<select id="per" style="margin-bottom:12px">${ps.map(x=>`<option${x===k?' selected':''}>${E(x)}</option>`).join('')}</select><div class="cols"><div><div class="card"><div class="row"><div><div class="sub">Collected this term</div><div class="big">${U(c)}</div></div><div class="ring" style="--p:${pc}"><b>${pc}%</b></div></div><table style="margin-top:10px"><tr><th>Expected</th><th>Collected</th><th>Outstanding</th></tr><tr><td>${U(e)}</td><td>${U(c)}</td><td class="bd">${U(o)}</td></tr></table></div><div class="card"><h2>By class</h2>${ks.length?`<table><tr><th>Class</th><th>Pupils</th><th>Collected</th><th>Owing</th></tr>${ks.map(x=>`<tr><td>${E(x)}</td><td>${by[x].n}</td><td>${U(by[x].c)}</td><td>${U(by[x].o)}</td></tr>`).join('')}</table>`:'<div class="empty">No pupils yet.</div>'}</div></div><div><div class="card"><h2>Daily collections</h2>${days.map(x=>`<div class="r clk" data-day="${x}"><div><b>${E(dlab(x))}</b><div class="sub">${dd[x].n} payment(s)${lastClosed()&&x<=lastClosed()?' · 🔒':''}</div></div><b>${U(dd[x].t)}</b></div>`).join('')||'<div class="empty">No payments this term.</div>'}</div><div class="card"><h2>Biggest balances</h2>${top.map(x=>`<div class="r"><div><b>${E(x.p.name)}</b><div class="sub">${E(cn(x.p))}</div></div><b class="bd">${U(x.o)}</b></div>`).join('')||'<div class="empty">Nobody owes.</div>'}</div></div></div>`}
const hits=()=>{const t=q.trim().toLowerCase();if(!t)return'<div class="empty">Type a pupil name or receipt number.</div>';const l=S.payments.filter(p=>{const u=pu(p.pupilId);return p.receipt.toLowerCase()===t||(u&&u.name.toLowerCase().includes(t))}).sort((a,b)=>b.seq-a.seq).slice(0,60);return l.length?l.map(p=>`<div class="clk" data-day="${E(p.date)}">${rowH(p)}</div>`).join(''):'<div class="empty">No matches.</div>'};
function vFind(){return`<div class="card"><input id="q" placeholder="Search pupil name or receipt number (e.g. R0042)" value="${E(q)}"><div id="res" style="margin-top:8px">${hits()}</div></div>`}
/* events */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-t],[data-d],[data-day]');if(!b)return;const D=b.dataset;if(D.a==='in'){const v=$('#pw').value;if(v)signIn(v,$('#rem').checked)}else if(D.a==='ref')refresh();else if(D.a==='out'){K=null;S=null;localStorage.removeItem('dirpw');login()}else if(D.t){tab=D.t;draw()}else if(D.d){vd=D.d===today()?'':D.d;draw()}else if(D.day){vd=D.day===today()?'':D.day;tab='today';draw();scrollTo(0,0)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#pw')&&document.activeElement===$('#pw'))$('[data-a=in]').click()});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#res').innerHTML=hits()}});
document.addEventListener('change',e=>{if(e.target.id==='per'){per=e.target.value;draw()}});
setInterval(()=>{if(K)refresh()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&K)refresh()});
const saved=localStorage.getItem('dirpw');saved?signIn(saved,true):login();
</script></body></html>
